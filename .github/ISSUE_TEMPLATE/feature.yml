name: Feature / task
description: Việc cần làm — viết đủ để đưa thẳng cho AI agent
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
      description: Người dùng được gì sau khi xong?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Danh sách kiểm tra được, mỗi dòng một ý.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Ghi chú
      description: File/thư mục liên quan, public API dùng tới, ràng buộc.
  - type: input
    id: deps
    attributes:
      label: Phụ thuộc
      placeholder: "#12, #15"
