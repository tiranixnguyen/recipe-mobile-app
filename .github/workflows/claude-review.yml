# Claude tự review PR khi mở (không chạy lại mỗi lần push — muốn review lại thì comment "@claude review lại").
# Action chỉ chạy khi workflow khớp với bản trên nhánh mặc định (main).
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Bạn là reviewer của một nhóm sinh viên làm app Flutter. Đọc AGENTS.md (nếu có) trước, rồi review PR này
            bằng tiếng Việt, ngắn gọn, giọng góp ý cho người mới.

            Ưu tiên theo thứ tự:
            1. Lỗi chạy sai, crash, mất dữ liệu.
            2. Vi phạm "Ranh giới feature" trong AGENTS.md: sửa ngoài thư mục feature của issue, import file
               bên trong feature khác thay vì public API `<f>.dart`, đụng `lib/core/`, `lib/app/`, `pubspec.yaml`.
            3. Thiếu test theo AGENTS.md (hàm trong `domain/` phải có unit test, màn hình có widget test).
            4. Acceptance criteria của issue được nhắc trong "Closes #N" — đọc issue bằng `gh issue view`.

            Không bắt bẻ format/lint (CI đã kiểm tra) hay khác biệt sở thích cá nhân. Không có gì đáng nói
            thì nói ngắn là ổn.

            Lỗi cụ thể → inline comment đúng dòng. Cuối cùng một comment tổng kết: các điểm cần sửa trước
            khi merge, rồi các gợi ý không bắt buộc.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
