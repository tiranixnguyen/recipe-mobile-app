<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ServingStepper — preview</title></head>
<body>
<div id="root" class="bh-stage"></div>
<script>
  var B = window.BepHoaLac, h = React.createElement;
  function Demo() {
    var s = React.useState(1);
    return h('div', { style: { display: 'flex', alignItems: 'center', gap: '24px' } },
      h(B.ServingStepper, { value: s[0], onChange: s[1] }),
      h('span', { style: { color: 'var(--ink-muted)', fontSize: '13px', fontWeight: 600 } }, 'Trứng gà · ' + (2 * s[0]) + ' quả'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
