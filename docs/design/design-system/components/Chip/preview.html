<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Chip — preview</title></head>
<body>
<div id="root" class="bh-stage"></div>
<script>
  var B = window.BepHoaLac, h = React.createElement;
  function Demo() {
    var s = React.useState({ quick: true, rice: false, veg: false, dinner: false }), on = s[0], set = s[1];
    function t(k) { return function () { var n = Object.assign({}, on); n[k] = !n[k]; set(n); }; }
    return h(React.Fragment, null,
      h(B.Chip, { selected: on.quick, icon: 'clock', onClick: t('quick') }, 'Dưới 15 phút'),
      h(B.Chip, { selected: on.rice, onClick: t('rice') }, 'Nồi cơm điện'),
      h(B.Chip, { selected: on.veg, onClick: t('veg') }, 'Chay'),
      h(B.Chip, { selected: on.dinner, onClick: t('dinner') }, 'Bữa tối'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
