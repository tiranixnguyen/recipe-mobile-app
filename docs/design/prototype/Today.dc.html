var total = dishes.reduce(function (t, d) { return t + d.min; }, 0);
var many = dishes.length > 1;
var crit = [scaleLabel, timeLabel, feelLabel === 'Theo thời tiết' ? (weather === 'mưa lạnh' ? 'Ấm bụng · trời mưa' : weather === 'nắng nóng' ? 'Giải nhiệt · trời nóng' : 'Theo giờ') : feelLabel];
if (fridge) { crit.push('Dọn tủ lạnh'); }
// A changed meal is a different meal: it is no longer the saved one.
function next() { self.setState({ idx: (self.state.idx + 1) % n, showReasons: false, saved: false }); }
function toast(text, link) {
if (snackTimer) { clearTimeout(snackTimer); }
self.setState({ snack: { text: text, link: !!link } });
// Spec chung (Toasts): 4 s, 6 s when there is an action.
snackTimer = setTimeout(function () { self.setState({ snack: null }); }, link ? 6000 : 4000);
}
return {
theme: p.theme ?? 'system',
title: MEAL_WORD[nextMeal(p.now)] + ' nay',
crit: crit,
critAria: 'Tiêu chí: ' + crit.join(', ') + '. Bấm để sửa',
relaxed: !!relaxed,
relaxedText: relaxed,
meal: {
dishes: dishes.map(function (d) {
return {
role: d.role, name: L(d.name), lower: L(d.name).toLowerCase(), min: d.min,
swapAria: 'Đổi ' + L(d.name),
swap: function () { if (d.extra) { return; } var sw = Object.assign({}, self.state.swaps); sw[key + '-' + d.k] = d.s + 1; self.setState({ swaps: sw, saved: false }); }
};
}),
tiles: mosaic(dishes.map(function (d) { return L(d.name); })),
meta: dishes.length + ' món · ~' + total + ' phút · Bếp từ',
have: m.full ? 'Đủ đồ' : 'Thiếu: ' + m.missing,
haveStyle: m.full ? 'background: var(--herb); color: #FFFFFF;' : 'background: var(--chili-soft); color: var(--chili-deep);',
why: m.why
},
alts: [1, 2].filter(function (k) { return k < n; }).map(function (k) {
var a = pool[(i + k) % n];
return { names: summary(a.dishes.map(function (d) { return d[1]; })), meta: a.dishes.length + ' món · ~' + a.total + ' phút' + (a.full ? ' · Đủ đồ' : ''), tiles: mosaic(a.dishes.map(function (d) { return d[1]; })), pick: function () { self.setState({ idx: (i + k) % n, showReasons: false, saved: false }); } };
}),
hasAlts: n > 1,
shuffle: next,
showReasons: st.showReasons,
toggleReasons: function () { self.setState({ showReasons: !self.state.showReasons }); },
reasons: REASONS.map(function (r) { return { label: r, pick: next }; }),
saved: st.saved,
saveLabel: st.saved ? 'Đã lưu' : 'Lưu lại',
saveFill: st.saved ? 'currentColor' : 'none',
saveStyle: st.saved ? 'color: var(--chili-deep); border-color: var(--chili);' : '',
toggleSave: function () {
var on = !self.state.saved;
self.setState({ saved: on });
toast(on ? (many ? 'Đã lưu bữa vào Đã lưu' : 'Đã lưu món vào Đã lưu') : 'Đã bỏ lưu', on);
},
hasSnack: !!st.snack,
snack: st.snack ? st.snack.text : '',
snackLink: !!(st.snack && st.snack.link)
};
}
}
</script>
