<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hôm nay ăn gì</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a{color:var(--chili-deep)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 4px; height: 64px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Quay lại" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Hôm nay ăn gì?</h1>
      <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">Bữa tối · theo tủ đồ và bếp của bạn</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 12px 16px 16px 16px">
    <div role="group" aria-label="Thời gian nấu" style="display: flex; gap: 8px">
      <sc-for list="{{times}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; font: 600 13px/18px 'Be Vietnam Pro', sans-serif; {{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <a href="Detail.dc.html" style="display: flex; flex-direction: column; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; color: var(--ink); text-decoration: none">
      <div style="height: 176px; background: var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-muted); font-size: 12px; line-height: 16px; position: relative">
        [Ảnh {{main.lower}}]
        <span style="position: absolute; left: 12px; top: 12px; padding: 2px 8px; border-radius: 8px; font-size: 12px; line-height: 16px; font-weight: 600; {{main.haveStyle}}">{{main.have}}</span>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 20px; line-height: 28px; font-weight: 600">{{main.name}}</span>
        <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px; font-weight: 600">{{main.meta}}</span>
        <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{main.why}}</span>
      </div>
    </a>

    <div style="display: flex; gap: 12px">
      <button onClick="{{toggleReasons}}" aria-expanded="{{showReasons}}" style="flex: 1; height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font: 600 15px/22px 'Be Vietnam Pro', sans-serif; cursor: pointer">Không thích</button>
      <button onClick="{{shuffle}}" style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--outline); border-radius: 12px; background: transparent; color: var(--ink); font: 600 15px/22px 'Be Vietnam Pro', sans-serif; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11l-3-3M20 17H9l3 3"></path></svg>
        Đổi món
      </button>
    </div>

    <sc-if value="{{showReasons}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface-raised); border: 1px solid var(--line)">
        <span style="font-size: 13px; line-height: 18px; font-weight: 600">Vì sao không hợp? App sẽ nhớ.</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
            <button onClick="{{r.pick}}" style="height: 36px; padding: 0 12px; border: 1px solid var(--outline); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; font: 600 13px/18px 'Be Vietnam Pro', sans-serif">{{r.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Hoặc thử</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{alts}}" as="a" hint-placeholder-count="2">
          <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 8px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none">
            <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background: var(--line)"></div>
            <div style="min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 13px; line-height: 18px; font-weight: 600">{{a.name}}</span>
              <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{a.time}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 16px 24px 16px; border-top: 1px solid var(--line); background: var(--surface-raised)">
    <a href="Detail.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--chili); color: #FFFFFF; text-decoration: none; font-size: 15px; line-height: 22px; font-weight: 600">Nấu món này</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
var DISHES = [
{ name: 'Trứng chiên hành', min: 15, meta: '15 phút · 1 người · Bếp từ', have: 'Có sẵn 3/3 nguyên liệu', full: true, why: 'Bạn có trứng, hành lá, cơm · chưa ăn món này 5 ngày' },
{ name: 'Canh cà chua trứng', min: 15, meta: '15 phút · 2 người · Bếp từ', have: 'Có sẵn 3/3 nguyên liệu', full: true, why: 'Dùng nốt cà chua trong tủ · hợp bữa tối' },
{ name: 'Trứng hấp thịt băm', min: 20, meta: '20 phút · 1 người · Nồi cơm điện', have: 'Thiếu thịt băm', full: false, why: 'Nấu cùng nồi cơm, không cần đứng bếp' },
{ name: 'Mì xào rau cải', min: 15, meta: '15 phút · 1 người · Bếp từ', have: 'Thiếu rau cải', full: false, why: 'Bạn còn 2 gói mì · món đã lưu' },
{ name: 'Cháo trứng hành', min: 25, meta: '25 phút · 1 người · Nồi cơm điện', have: 'Có sẵn 3/3 nguyên liệu', full: true, why: 'Bữa tối nhẹ · dùng cơm nguội' }
];
var TIMES = [['15', 'Dưới 15 phút', 15], ['30', 'Dưới 30 phút', 30], ['any', 'Thoải mái', 999]];
var REASONS = ['Vừa ăn rồi', 'Thiếu đồ', 'Lâu quá', 'Không hợp khẩu vị'];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { idx: 0, time: '30', showReasons: false };
}
renderVals() {
var self = this;
var st = this.state;
var limit = TIMES.filter(function (t) { return t[0] === st.time; })[0][2];
var pool = DISHES.filter(function (d) { return d.min <= limit; });
var n = pool.length;
var m = pool[st.idx % n];
function next() { self.setState({ idx: (self.state.idx + 1) % n, showReasons: false }); }
return {
theme: this.props.theme ?? 'system',
times: TIMES.map(function (t) {
var on = t[0] === st.time;
return {
label: t[1], on: on,
style: on ? 'border: 1px solid var(--chili-soft); background: var(--chili-soft); color: var(--chili-deep);' : 'border: 1px solid var(--outline); background: transparent; color: var(--ink);',
pick: function () { self.setState({ time: t[0], idx: 0, showReasons: false }); }
};
}),
main: {
name: m.name, lower: m.name.toLowerCase(), meta: m.meta, have: m.have, why: m.why,
haveStyle: m.full ? 'background: var(--herb); color: #FFFFFF;' : 'background: var(--chili-soft); color: var(--chili-deep);'
},
alts: [pool[(st.idx + 1) % n], pool[(st.idx + 2) % n]].map(function (d) { return { name: d.name, time: d.min + ' phút' }; }),
shuffle: next,
showReasons: st.showReasons,
toggleReasons: function () { self.setState({ showReasons: !self.state.showReasons }); },
reasons: REASONS.map(function (r) { return { label: r, pick: next }; })
};
}
}
</script>
</body>
</html>
