<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm vào thực đơn</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a.bh-btn-primary,a.bh-btn-primary:hover{color:#FFFFFF}
a.bh-btn-secondary,a.bh-btn-secondary:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px">
    <div style="height: 240px; background: var(--line)"></div>
    <span style="padding: 0 16px; font-size: 28px; line-height: 34px; font-weight: 700">Trứng chiên hành</span>
  </div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20, 14, 10, 0.55)">
    <div role="dialog" aria-labelledby="sheet-title" style="display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 24px 16px; border-radius: 20px 20px 0 0; background: var(--surface-raised)">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: var(--line)"></span>

      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 id="sheet-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Thêm vào thực đơn</h1>
        <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px; font-weight: 600">Trứng chiên hành · 15 phút · Bếp từ</span>
      </div>

      <div role="group" aria-label="Chọn nhanh" style="display: flex; gap: 8px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
          <x-import component-from-global-scope="BepHoaLac.Chip" selected="{{q.on}}" on-click="{{q.pick}}">{{q.label}}</x-import>
        </sc-for>
      </div>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <span id="lbl-day" style="font-size: 13px; line-height: 18px; font-weight: 600">Ngày</span>
        <div role="radiogroup" aria-labelledby="lbl-day" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <button role="radio" aria-checked="{{d.on}}" aria-label="{{d.full}}" onClick="{{d.pick}}" style="height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif; {{d.style}}">
              <span style="font-size: 13px; line-height: 18px; font-weight: 600">{{d.short}}</span>
              <span style="font-size: 10px; line-height: 12px; font-weight: 600; min-height: 12px; display: flex; align-items: center">{{d.sub}}<span style="width: 6px; height: 6px; border-radius: 999px; {{d.dotStyle}}"></span></span>
            </button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <span id="lbl-meal" style="font-size: 13px; line-height: 18px; font-weight: 600">Bữa</span>
        <div role="radiogroup" aria-labelledby="lbl-meal" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{meals}}" as="m" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 52px; padding: 8px 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; cursor: pointer; text-align: left; font-family: 'Be Vietnam Pro', sans-serif; color: var(--ink); {{m.style}}">
              <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{m.ringStyle}}"><span style="width: 10px; height: 10px; border-radius: 999px; {{m.dotStyle}}"></span></span>
              <span style="width: 44px; font-size: 15px; line-height: 22px; font-weight: 600">{{m.label}}</span>
              <span style="flex: 1; min-width: 0; color: var(--ink-muted); font-size: 13px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.has}}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{joining}}" hint-placeholder-val="{{true}}">
          <div aria-live="polite" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--herb-soft); font-size: 13px; line-height: 18px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--herb-ink); flex-shrink: 0"><path d="M12 5v14M5 12h14"></path></svg>
            <span>{{joinText}}</span>
          </div>
        </sc-if>
      </section>

      <section style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; line-height: 22px; font-weight: 600">Khẩu phần</span>
        <x-import component-from-global-scope="BepHoaLac.ServingStepper" value="{{servings}}" min="{{one}}" max="{{six}}" on-change="{{setServings}}" label="Khẩu phần"></x-import>
      </section>

      <div style="display: flex; gap: 12px; padding-top: 4px">
        <a href="Detail.dc.html" class="bh-btn bh-btn-secondary" style="flex: 0 0 96px; padding: 0 12px; text-decoration: none">Huỷ</a>
        <a href="MealPlan.dc.html" class="bh-btn bh-btn-primary" style="flex: 1; padding: 0 12px; text-decoration: none">{{cta}}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
var DAYS = [['T2', 'Thứ Hai', 'thứ Hai'], ['T3', 'Thứ Ba', 'thứ Ba'], ['T4', 'Thứ Tư', 'thứ Tư'], ['T5', 'Thứ Năm', 'thứ Năm'], ['T6', 'Thứ Sáu', 'thứ Sáu'], ['T7', 'Thứ Bảy', 'thứ Bảy'], ['CN', 'Chủ nhật', 'Chủ nhật']];
var MEALS = ['Sáng', 'Trưa', 'Tối'];
var TODAY = 1;
// Same plan as the Thực đơn screen: each meal holds a list of dishes.
var PLAN = [
[['Bánh mì trứng ốp'], ['Mì xào rau cải'], ['Canh cà chua trứng']],
[[], ['Cơm rang dưa cải'], ['Đậu phụ sốt cà chua']],
[[], ['Trứng hấp thịt băm'], []],
[[], [], []],
[[], [], []],
[[], [], []],
[[], [], []]
];
var QUICK = [['Tối nay', TODAY, 2], ['Trưa mai', TODAY + 1, 1], ['Tối mai', TODAY + 1, 2]];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: TODAY, meal: 2, servings: 1 };
}
renderVals() {
var self = this;
var st = this.state;
var existing = PLAN[st.day][st.meal];
var when = MEALS[st.meal] + ' ' + (st.day === TODAY ? 'nay' : st.day === TODAY + 1 ? 'mai' : DAYS[st.day][2]);
return {
theme: this.props.theme ?? 'system',
one: 1,
six: 6,
servings: st.servings,
setServings: function (v) { self.setState({ servings: v }); },
quick: QUICK.map(function (q) {
return { label: q[0], on: st.day === q[1] && st.meal === q[2], pick: function () { self.setState({ day: q[1], meal: q[2] }); } };
}),
days: DAYS.map(function (d, i) {
var on = i === st.day;
var any = PLAN[i].some(function (m) { return m.length > 0; });
return {
short: d[0],
full: d[1] + (i === TODAY ? ', hôm nay' : ''),
sub: i === TODAY ? 'Nay' : '',
on: on,
style: on ? 'border: 1px solid var(--chili); background: var(--chili); color: #FFFFFF;' : 'border: 1px solid var(--line); background: var(--surface); color: var(--ink);',
dotStyle: i !== TODAY && any ? (on ? 'background: #FFFFFF;' : 'background: var(--herb);') : 'display: none;',
pick: function () { self.setState({ day: i }); }
};
}),
meals: MEALS.map(function (m, j) {
var on = j === st.meal;
var dishes = PLAN[st.day][j];
return {
label: m,
has: dishes.length ? dishes.join(', ') : 'Trống',
on: on,
style: on ? 'border: 2px solid var(--chili); background: var(--chili-soft);' : 'border: 1px solid var(--outline); background: var(--surface-raised);',
ringStyle: on ? 'border: 2px solid var(--chili);' : 'border: 2px solid var(--outline);',
dotStyle: on ? 'background: var(--chili);' : 'background: transparent;',
pick: function () { self.setState({ meal: j }); }
};
}),
joining: existing.length > 0,
joinText: existing.length ? 'Sẽ thêm cùng ' + existing.join(', ') + ' · bữa này thành ' + (existing.length + 1) + ' món' : '',
cta: 'Thêm vào ' + when
};
}
}
</script>
</body>
</html>
