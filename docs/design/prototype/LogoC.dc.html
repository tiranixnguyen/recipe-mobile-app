<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>

<style>

<div style="width: 1440px; height: 900px; padding: 40px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: 340px 1fr; gap: 24px; background: #FFF8F1; color: #2A1E16; font-family: 'Be Vietnam Pro', system-ui, sans-serif">

  <section aria-label="Logo trên nền sáng" style="grid-column: span 7; display: flex; align-items: center; gap: 48px; padding: 40px; border-radius: 28px; background: #FFFFFF; border: 1px solid #EADFD3">
    <svg role="img" aria-label="Icon app Bếp Hoà Lạc" width="200" height="200" viewBox="0 0 96 96" style="flex-shrink: 0; border-radius: 46px"><rect width="96" height="96" fill="#FFE3CC"></rect><g transform="translate(-2 -1)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
    <div style="display: flex; flex-direction: column; gap: 36px">
      <div style="display: flex; align-items: center; gap: 16px">
        <svg aria-hidden="true" width="72" height="70" viewBox="14 14 72 70"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></svg>
        <span style="font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -.02em">Bếp Hoà Lạc</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px">
        <svg aria-hidden="true" width="56" height="54" viewBox="14 14 72 70"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></svg>
        <span style="font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: -.01em">Bếp Hoà Lạc</span>
        <span style="color: #6E5D50; font-size: 13px; line-height: 18px">Có gì nấu nấy, ăn gì cũng có kế hoạch.</span>
      </div>
    </div>
  </section>

  <section aria-label="Logo trên nền tối" style="grid-column: span 5; display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 40px; border-radius: 28px; background: #1A1410; color: #F5EDE6">
    <div style="display: flex; align-items: center; gap: 16px">
      <svg aria-hidden="true" width="72" height="70" viewBox="14 14 72 70"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#E0601F" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#F5EDE6"></path></svg>
      <span style="font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: -.02em">Bếp Hoà Lạc</span>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <svg role="img" aria-label="Icon app trên nền tối" width="96" height="96" viewBox="0 0 96 96" style="border-radius: 24px"><rect width="96" height="96" fill="#FFE3CC"></rect><g transform="translate(-2 -1)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
      <span style="color: #BFAE9F; font-size: 14px; line-height: 20px; max-width: 240px">Icon app giữ nền cam nhạt ở cả hai giao diện. Trên nền tối, logo đổi bát sang màu kem.</span>
    </div>
  </section>

  <section aria-label="Adaptive icon Android" style="grid-column: span 7; display: flex; flex-direction: column; gap: 20px; padding: 32px 40px; border-radius: 28px; background: #FFFFFF; border: 1px solid #EADFD3">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .06em; color: #9A3412">ADAPTIVE ICON ANDROID</span>
    <div style="display: flex; align-items: flex-end; gap: 28px">
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg role="img" aria-label="Lớp trước với vùng an toàn" width="140" height="140" viewBox="0 0 108 108" style="background: #FFF8F1; border: 1px dashed #958170"><circle cx="54" cy="54" r="33" fill="none" stroke="#958170" stroke-width="0.8" stroke-dasharray="2 2"></circle><g transform="translate(54 54) scale(0.72) translate(-50 -49)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Lớp trước · vùng an toàn 66dp</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 140px; height: 140px; background: #FFE3CC; border: 1px dashed #958170"></div>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Lớp nền · #FFE3CC</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg role="img" aria-label="Icon cắt hình tròn" width="96" height="96" viewBox="0 0 108 108" style="border-radius: 999px"><rect width="108" height="108" fill="#FFE3CC"></rect><g transform="translate(54 54) scale(0.72) translate(-50 -49)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Tròn</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg role="img" aria-label="Icon cắt bo góc" width="96" height="96" viewBox="0 0 108 108" style="border-radius: 30px"><rect width="108" height="108" fill="#FFE3CC"></rect><g transform="translate(54 54) scale(0.72) translate(-50 -49)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Bo góc</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg role="img" aria-label="Icon cắt hình vuông mềm" width="96" height="96" viewBox="0 0 108 108" style="border-radius: 12px"><rect width="108" height="108" fill="#FFE3CC"></rect><g transform="translate(54 54) scale(0.72) translate(-50 -49)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Vuông mềm</figcaption>
      </figure>
    </div>
  </section>

  <section aria-label="Cỡ nhỏ và một màu" style="grid-column: span 5; display: flex; flex-direction: column; gap: 20px; padding: 32px 40px; border-radius: 28px; background: #FFFFFF; border: 1px solid #EADFD3">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .06em; color: #9A3412">CỠ NHỎ · MỘT MÀU</span>
    <div style="display: flex; align-items: flex-end; gap: 20px">
      <svg role="img" aria-label="Icon 72px" width="72" height="72" viewBox="0 0 96 96" style="border-radius: 18px"><rect width="96" height="96" fill="#FFE3CC"></rect><g transform="translate(-2 -1)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
      <svg role="img" aria-label="Icon 48px" width="48" height="48" viewBox="0 0 96 96" style="border-radius: 12px"><rect width="96" height="96" fill="#FFE3CC"></rect><g transform="translate(-2 -1)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
      <svg role="img" aria-label="Icon 32px" width="32" height="32" viewBox="0 0 96 96" style="border-radius: 8px"><rect width="96" height="96" fill="#FFE3CC"></rect><g transform="translate(-2 -1)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="6" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
      <svg role="img" aria-label="Icon 24px" width="24" height="24" viewBox="0 0 96 96" style="border-radius: 6px"><rect width="96" height="96" fill="#FFE3CC"></rect><g transform="translate(-2 -1)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#C2410C" stroke-width="7" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#2A1E16"></path></g></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg role="img" aria-label="Themed icon Android 13" width="72" height="72" viewBox="0 0 108 108" style="border-radius: 999px"><rect width="108" height="108" fill="#E8DED5"></rect><g transform="translate(54 54) scale(0.72) translate(-50 -49)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#4A3A2E" stroke-width="6" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#4A3A2E"></path></g></svg>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Themed icon</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="width: 72px; height: 72px; border-radius: 999px; background: #2A1E16; display: flex; align-items: center; justify-content: center">
          <svg role="img" aria-label="Icon thông báo" width="36" height="36" viewBox="0 0 108 108"><g transform="translate(54 54) scale(0.9) translate(-50 -49)"><path d="M38 44L74 18M48 46L82 24" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path><path d="M18 50h60a30 30 0 0 1-60 0z" fill="#FFFFFF"></path></g></svg>
        </div>
        <figcaption style="font-size: 12px; line-height: 16px; color: #6E5D50">Thông báo</figcaption>
      </figure>
    </div>
  </section>
</div>
