<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lỗi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a.bh-btn-primary,a.bh-btn-primary:hover{color:#FFFFFF}
a.bh-btn-secondary,a.bh-btn-secondary:hover{color:var(--ink)}
.big .bh-icon{width:44px;height:44px;stroke-width:1.5}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <main role="alert" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px 32px 48px 32px; text-align: center">
    <div class="big" style="width: 96px; height: 96px; border-radius: 999px; background: var(--chili-soft); color: var(--chili); display: flex; align-items: center; justify-content: center">
      <x-import component-from-global-scope="BepHoaLac.Icon" name="{{e.icon}}"></x-import>
    </div>
    <h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 600">{{e.title}}</h1>
    <p style="margin: 0; color: var(--ink-muted); font-size: 15px; line-height: 22px">{{e.text}}</p>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; padding-top: 8px">
      <a href="{{e.primaryHref}}" class="bh-btn bh-btn-primary bh-btn-block bh-btn-lg" style="text-decoration: none">{{e.primary}}</a>
      <a href="Feedback.dc.html" class="bh-btn bh-btn-secondary bh-btn-block" style="text-decoration: none">Báo lỗi cho nhóm</a>
    </div>
    <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">Mã lỗi: [ERR-XXXX]</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"variant":{"editor":"enum","options":["crash","notfound","storage"],"default":"crash"},"$preview":{"width":390,"height":844}}'>
var VARIANTS = {
crash: { icon: 'alert', title: 'Có gì đó trục trặc', text: 'App gặp lỗi khi mở màn này. Dữ liệu của bạn vẫn an toàn trên máy.', primary: 'Thử lại', primaryHref: 'Main.dc.html' },
notfound: { icon: 'search', title: 'Không tìm thấy món này', text: 'Món có thể đã bị gỡ trong bản cập nhật mới. Thử tìm món tương tự nhé.', primary: 'Về Khám phá', primaryHref: 'Main.dc.html' },
storage: { icon: 'alert', title: 'Máy hết dung lượng', text: 'Chưa lưu được thực đơn vừa sửa. Dọn bớt ảnh hoặc app khác rồi thử lại.', primary: 'Thử lưu lại', primaryHref: 'MealPlan.dc.html' }
};
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'system', e: VARIANTS[this.props.variant ?? 'crash'] || VARIANTS.crash };
}
}
</script>
</body>
</html>
