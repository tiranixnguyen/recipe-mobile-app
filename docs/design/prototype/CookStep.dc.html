<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nấu từng bước</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a{color:var(--chili-deep)}
a.bh-btn-primary,a.bh-btn-primary:hover{color:#FFFFFF}
.c1{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
main{scrollbar-width:none}
.bh-timer-text{min-width:0}
.bh-timer-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 0 4px; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Detail.dc.html" aria-label="Thoát chế độ nấu" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <x-import component-from-global-scope="BepHoaLac.Icon" name="close"></x-import>
      </a>
      <span style="font-size: 15px; line-height: 22px; font-weight: 600">Bước {{stepNo}}/{{stepCount}}</span>
      <x-import component-from-global-scope="BepHoaLac.Button" variant="ghost" icon="list" on-click="{{openSheet}}">Nguyên liệu</x-import>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-left: 12px">
      <sc-for list="{{segments}}" as="sg" hint-placeholder-count="4">
        <span style="height: 6px; border-radius: 999px; {{sg.style}}"></span>
      </sc-for>
    </div>
    <span style="padding-left: 12px; color: var(--ink-muted); font-size: 12px; line-height: 16px">Màn hình luôn sáng khi đang nấu</span>
  </header>

  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 32px 24px 16px 24px">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; color: var(--chili-deep); letter-spacing: .04em">BƯỚC {{stepNo}}</span>
    <p aria-live="polite" style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 400">{{step.text}}</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{step.uses}}" as="u" hint-placeholder-count="2">
        <span style="padding: 4px 10px; border-radius: 999px; background: var(--surface-raised); border: 1px solid var(--line); font-size: 13px; line-height: 18px; font-weight: 600">{{u}}</span>
      </sc-for>
    </div>
  </main>

  <section aria-label="Hẹn giờ" style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 16px 12px 16px">
    <sc-for list="{{timers}}" as="tm" hint-placeholder-count="1">
      <div style="{{tm.style}}">
        <x-import component-from-global-scope="BepHoaLac.StepTimer" seconds="{{tm.sec}}" label="{{tm.name}}" on-status-change="{{tm.onStatus}}"></x-import>
      </div>
    </sc-for>
  </section>

  <footer style="flex-shrink: 0; display: flex; gap: 12px; padding: 12px 16px 24px 16px; border-top: 1px solid var(--line); background: var(--surface-raised)">
    <x-import component-from-global-scope="BepHoaLac.Button" variant="secondary" icon="back" size="lg" block="{{yes}}" disabled="{{isFirst}}" on-click="{{prev}}" style="flex: 1">Bước trước</x-import>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
      <x-import component-from-global-scope="BepHoaLac.Button" size="lg" block="{{yes}}" on-click="{{next}}" style="flex: 1.4">Bước tiếp</x-import>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
      <a href="CookDone.dc.html" class="bh-btn bh-btn-primary bh-btn-lg" style="flex: 1.4; text-decoration: none">
        <x-import component-from-global-scope="BepHoaLac.Icon" name="check"></x-import>
        Xong
      </a>
    </sc-if>
  </footer>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20, 14, 10, 0.55)">
      <div role="dialog" aria-label="Nguyên liệu" style="padding: 8px 16px 24px 16px; border-radius: 16px 16px 0 0; background: var(--surface-raised); display: flex; flex-direction: column; gap: 12px">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: var(--line)"></span>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Nguyên liệu · 1 người</h2>
          <x-import component-from-global-scope="BepHoaLac.Button" variant="ghost" on-click="{{closeSheet}}">Đóng</x-import>
        </div>
        <ul style="margin: 0; padding: 0; list-style: none">
          <li style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px"><span>Trứng gà</span><span style="font-weight: 600">2 quả</span></li>
          <li style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px"><span>Hành lá</span><span style="font-weight: 600">1 nắm</span></li>
          <li style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px"><span>Cơm trắng</span><span style="font-weight: 600">1 suất</span></li>
          <li style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 15px; line-height: 22px"><span>Dầu ăn, nước mắm, tiêu</span><span style="font-weight: 600">Vừa đủ</span></li>
        </ul>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
var STEPS = [
{ text: 'Thái nhỏ hành lá. Đập 2 quả trứng ra bát, thêm chút nước mắm, tiêu và hành, đánh tan.', uses: ['2 quả trứng', 'Hành lá', 'Nước mắm, tiêu'], sec: 0 },
{ text: 'Bật bếp từ mức vừa, cho 1 thìa dầu vào chảo và đợi dầu nóng.', uses: ['Dầu ăn', 'Chảo'], sec: 60, timerName: 'Làm nóng dầu' },
{ text: 'Đổ trứng vào chảo, nghiêng chảo cho trứng dàn đều. Chiên đến khi mặt dưới vàng.', uses: ['Trứng đã đánh'], sec: 180, timerName: 'Chiên mặt dưới' },
{ text: 'Lật trứng, chiên thêm một chút rồi xúc ra đĩa. Ăn nóng cùng cơm.', uses: ['Cơm trắng'], sec: 60, timerName: 'Chiên mặt trên' }
];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { i: 0, sheet: false, status: {} };
}
renderVals() {
var self = this;
var st = this.state;
var s = STEPS[st.i];
var timers = [];
STEPS.forEach(function (x, k) {
// One StepTimer per timed step, kept mounted; a running or finished one stays visible on every step.
if (x.sec > 0) {
var shown = k === st.i || (st.status[k] || 'idle') !== 'idle';
timers.push({
sec: x.sec,
name: x.timerName,
style: shown ? 'display: block;' : 'display: none;',
onStatus: function (v) {
var next = Object.assign({}, self.state.status);
next[k] = v;
self.setState({ status: next });
}
});
}
});
return {
theme: this.props.theme ?? 'system',
yes: true,
stepNo: st.i + 1,
stepCount: STEPS.length,
step: { text: s.text, uses: s.uses },
segments: STEPS.map(function (x, k) { return { style: k <= st.i ? 'background: var(--chili);' : 'background: var(--line);' }; }),
timers: timers,
isFirst: st.i === 0,
notLast: st.i < STEPS.length - 1,
isLast: st.i === STEPS.length - 1,
prev: function () { self.setState({ i: Math.max(0, self.state.i - 1) }); },
next: function () { self.setState({ i: Math.min(STEPS.length - 1, self.state.i + 1) }); },
sheetOpen: st.sheet,
openSheet: function () { self.setState({ sheet: true }); },
closeSheet: function () { self.setState({ sheet: false }); }
};
}
}
</script>
</body>
</html>
