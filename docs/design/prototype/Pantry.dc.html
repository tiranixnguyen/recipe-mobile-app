<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tủ đồ</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a{color:var(--chili-deep)}
.c1{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
main{scrollbar-width:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 2px; padding: 16px 16px 8px 16px; flex-shrink: 0">
    <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Tủ đồ</h1>
    <p style="margin: 0; color: var(--ink-muted); font-size: 13px; line-height: 18px">Bấm vào thứ bạn đang có, app tìm món nấu được.</p>
  </header>

  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 16px 16px">
    <section aria-label="Nguyên liệu đang có" style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{groups}}" as="group" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-muted)">{{group.label}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{group.items}}" as="ing" hint-placeholder-count="4">
              <button onClick="{{ing.toggle}}" aria-pressed="{{ing.on}}" style="height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 4px; border-radius: 999px; font: 600 13px/18px 'Be Vietnam Pro', sans-serif; cursor: pointer; {{ing.chipStyle}}">
                <sc-if value="{{ing.on}}" hint-placeholder-val="{{false}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
                </sc-if>
                {{ing.name}}
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 24px; font-weight: 600">
        Nấu được ngay
        <span style="padding: 0 8px; border-radius: 8px; background: var(--herb); color: #FFFFFF; font-size: 12px; line-height: 20px; font-weight: 600">{{readyCount}}</span>
      </h2>
      <sc-if value="{{noReady}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; color: var(--ink-muted); font-size: 13px; line-height: 18px">Chưa đủ đồ cho món nào. Thử bật thêm vài nguyên liệu.</p>
      </sc-if>
      <sc-for list="{{ready}}" as="r" hint-placeholder-count="2">
        <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none">
          <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px; background: var(--line)"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span class="c2" style="font-size: 15px; line-height: 22px; font-weight: 600">{{r.name}}</span>
            <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{r.meta}}</span>
          </div>
        </a>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Thiếu 1–2 thứ</h2>
      <sc-for list="{{near}}" as="r" hint-placeholder-count="2">
        <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none">
          <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px; background: var(--line)"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span class="c2" style="font-size: 15px; line-height: 22px; font-weight: 600">{{r.name}}</span>
            <span style="color: var(--chili-deep); font-size: 12px; line-height: 16px; font-weight: 600">{{r.missing}}</span>
          </div>
        </a>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Điều hướng chính" style="height: 80px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface-raised); border-top: 1px solid var(--line)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      </span>
      Khám phá
    </a>
    <a href="Pantry.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 999px; background: var(--chili-soft); color: var(--chili-deep); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M6 10h12M9 6v2M9 13v3"></path></svg>
      </span>
      Tủ đồ
    </a>
    <a href="MealPlan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></svg>
      </span>
      Thực đơn
    </a>
    <a href="Saved.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>
      </span>
      Đã lưu
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
var GROUPS = [
{ label: 'Đạm', items: [['egg', 'Trứng'], ['tofu', 'Đậu phụ'], ['pork', 'Thịt băm'], ['sausage', 'Xúc xích']] },
{ label: 'Rau củ', items: [['tomato', 'Cà chua'], ['scallion', 'Hành lá'], ['greens', 'Rau cải'], ['potato', 'Khoai tây']] },
{ label: 'Tinh bột', items: [['rice', 'Cơm'], ['noodle', 'Mì gói'], ['bread', 'Bánh mì']] }
];
var NAMES = {};
GROUPS.forEach(function (g) { g.items.forEach(function (it) { NAMES[it[0]] = it[1].toLowerCase(); }); });
var RECIPES = [
{ name: 'Trứng chiên hành', meta: '15 phút · Bếp từ', needs: ['egg', 'scallion', 'rice'] },
{ name: 'Canh cà chua trứng', meta: '15 phút · Bếp từ', needs: ['egg', 'tomato', 'scallion'] },
{ name: 'Mì xào rau cải', meta: '15 phút · Bếp từ', needs: ['noodle', 'greens'] },
{ name: 'Đậu phụ sốt cà chua', meta: '20 phút · Bếp từ', needs: ['tofu', 'tomato', 'scallion'] },
{ name: 'Bánh mì trứng ốp', meta: '10 phút · Bếp từ', needs: ['bread', 'egg'] },
{ name: 'Trứng hấp thịt băm', meta: '20 phút · Nồi cơm điện', needs: ['egg', 'pork', 'scallion'] },
{ name: 'Khoai tây xào thịt băm', meta: '25 phút · Bếp từ', needs: ['potato', 'pork', 'scallion'] }
];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { have: { egg: true, scallion: true, rice: true, tomato: true, noodle: true } };
}
renderVals() {
var have = this.state.have;
var self = this;
var groups = GROUPS.map(function (g) {
return {
label: g.label,
items: g.items.map(function (it) {
var on = !!have[it[0]];
return {
name: it[1],
on: on,
chipStyle: on ? 'border: 1px solid var(--chili-soft); background: var(--chili-soft); color: var(--chili-deep);' : 'border: 1px solid var(--outline); background: transparent; color: var(--ink);',
toggle: function () {
var next = Object.assign({}, self.state.have);
next[it[0]] = !on;
self.setState({ have: next });
}
};
})
};
});
var ready = [];
var near = [];
RECIPES.forEach(function (r) {
var miss = r.needs.filter(function (id) { return !have[id]; });
if (miss.length === 0) { ready.push({ name: r.name, meta: r.meta }); }
else if (miss.length <= 2) { near.push({ name: r.name, missing: 'Thiếu: ' + miss.map(function (id) { return NAMES[id]; }).join(', ') }); }
});
return { theme: this.props.theme ?? 'system', groups: groups, ready: ready, near: near.slice(0, 3), readyCount: ready.length, noReady: ready.length === 0 };
}
}
</script>
</body>
</html>
