<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nguyên liệu chưa dùng tới</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a.bh-btn-primary,a.bh-btn-primary:hover{color:#FFFFFF}
input[type=checkbox]{accent-color:var(--herb)}
.c1{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
main{scrollbar-width:none}
.iconbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 4px; height: 64px; flex-shrink: 0">
    <a href="{{backHref}}" class="iconbtn" aria-label="Quay lại chấm món">
      <x-import component-from-global-scope="BepHoaLac.Icon" name="back"></x-import>
    </a>
    <div style="min-width: 0; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Nguyên liệu chưa dùng tới</h1>
      <span class="c1" style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{sub}}</span>
    </div>
  </header>

  <!-- Flutter (F2 + F3): ticked = still in the pantry; unticked items go through removeFromPantry (F3 public API)
       when the user taps "Cập nhật tủ và xong", then the cook entry is written to cookHistoryProvider and the app
       opens the Lịch sử tab. Defaults come from the recipe amounts vs the pantry. -->
  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 16px 16px">
    <p style="margin: 0; color: var(--ink-muted); font-size: 13px; line-height: 18px">Tick thứ vẫn còn trong tủ. Bỏ tick thì app xoá khỏi tủ.</p>
    <ul style="margin: 0; padding: 0 12px; list-style: none; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <li style="{{it.rowStyle}}">
          <label style="min-height: 60px; padding: 8px 0; display: flex; align-items: center; gap: 12px; cursor: pointer">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 15px; line-height: 22px; font-weight: 600; {{it.nameStyle}}">{{it.name}}</span>
              <span class="c2" style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{it.note}}</span>
            </span>
            <span style="font-size: 13px; line-height: 18px; font-weight: 600">Còn</span>
            <input type="checkbox" checked="{{it.left}}" onChange="{{it.toggle}}" aria-label="{{it.aria}}" style="width: 22px; height: 22px; margin: 0">
          </label>
        </li>
      </sc-for>
    </ul>
    <span aria-live="polite" style="color: var(--ink-muted); font-size: 13px; line-height: 18px">{{summary}}</span>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 16px 24px 16px; border-top: 1px solid var(--line); background: var(--surface-raised)">
    <a href="History.dc.html" class="bh-btn bh-btn-primary bh-btn-block bh-btn-lg" style="text-decoration: none">Cập nhật tủ và xong</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"source":{"editor":"enum","options":["bữa","món"],"default":"bữa"},"$preview":{"width":390,"height":844}}'>
var MEAL = [
{ id: 'tofu', name: 'Đậu phụ', note: 'Đã dùng 2 bìa · Đậu phụ sốt cà chua', left: false },
{ id: 'tomato', name: 'Cà chua', note: 'Đã dùng 2 quả · Đậu phụ sốt cà chua', left: false },
{ id: 'egg', name: 'Trứng gà', note: 'Đã dùng 2 quả · Trứng chiên hành · tủ có 10 quả', left: true },
{ id: 'onion', name: 'Hành lá', note: 'Đã dùng 2 nắm · cả 2 món', left: false },
{ id: 'garlic', name: 'Tỏi', note: 'Đã dùng 3 tép · Đậu phụ sốt cà chua', left: true }
];
var ONE = [
{ id: 'egg', name: 'Trứng gà', note: 'Đã dùng 2 quả · tủ có 10 quả', left: true },
{ id: 'onion', name: 'Hành lá', note: 'Đã dùng 1 nắm', left: false },
{ id: 'rice', name: 'Cơm trắng', note: 'Đã dùng 1 suất', left: false }
];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { left: {} };
}
renderVals() {
var self = this;
var st = this.state;
var one = this.props.source === 'món';
var list = one ? ONE : MEAL;
var gone = [];
var items = list.map(function (u, i) {
var l = st.left[u.id] === undefined ? u.left : st.left[u.id];
if (!l) { gone.push(u.name.toLowerCase()); }
return {
name: u.name, note: u.note, left: l,
aria: u.name + ': vẫn còn trong tủ',
nameStyle: l ? '' : 'color: var(--ink-muted);',
rowStyle: i < list.length - 1 ? 'border-bottom: 1px solid var(--line);' : '',
toggle: function () { var next = Object.assign({}, self.state.left); next[u.id] = !l; self.setState({ left: next }); }
};
});
return {
theme: this.props.theme ?? 'system',
sub: one ? 'Trứng chiên hành' : 'Bữa tối · 2 món',
backHref: one ? 'CookDone.dc.html' : 'MealCookDone.dc.html',
items: items,
summary: gone.length ? 'Sẽ xoá khỏi tủ: ' + gone.join(', ') + '.' : 'Tủ giữ nguyên, không xoá gì.'
};
}
}
</script>
</body>
</html>
