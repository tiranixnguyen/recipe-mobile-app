<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Xong cả bữa</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a.bh-btn-primary,a.bh-btn-primary:hover{color:#FFFFFF}
input[type=checkbox]{accent-color:var(--herb)}
.done-art .bh-icon{width:40px;height:40px;stroke-width:1.5}
.rate{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;padding:0}
.rate:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.rate .bh-icon{width:24px;height:24px}
.c1{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note{width:100%;resize:none;border:1px solid var(--outline);border-radius:12px;background:var(--surface-raised);color:var(--ink);padding:10px 12px;font:400 15px/22px 'Be Vietnam Pro',sans-serif}
.note:focus{outline:2px solid var(--chili);outline-offset:1px}
.addnote{align-self:flex-start;min-height:36px;padding:0;border:0;background:transparent;color:var(--chili-deep);cursor:pointer;font:600 13px/18px 'Be Vietnam Pro',sans-serif}
.addnote:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
main{scrollbar-width:none}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <main style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 24px 16px 12px 16px">
    <section style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
      <div class="done-art" style="width: 80px; height: 80px; border-radius: 999px; background: var(--chili-soft); color: var(--chili); display: flex; align-items: center; justify-content: center">
        <x-import component-from-global-scope="BepHoaLac.Icon" name="bowl"></x-import>
      </div>
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Xong bữa tối! Ăn ngon nhé</h1>
      <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px; font-weight: 600">{{meta}}</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">Từng món thế nào?</h2>
      <ul style="margin: 0; padding: 0 12px; list-style: none; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px">
        <sc-for list="{{dishes}}" as="dh" hint-placeholder-count="2">
          <li style="padding: 10px 0; display: flex; flex-direction: column; gap: 6px; {{dh.rowStyle}}">
            <div style="min-height: 48px; display: flex; align-items: center; gap: 8px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span class="c2" style="font-size: 15px; line-height: 22px; font-weight: 600">{{dh.name}}</span>
              <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{dh.picked}}</span>
            </span>
            <span role="group" aria-label="{{dh.groupLabel}}" style="display: flex; gap: 6px">
              <sc-for list="{{dh.ratings}}" as="r" hint-placeholder-count="3">
                <button class="rate" onClick="{{r.pick}}" aria-pressed="{{r.on}}" aria-label="{{r.label}}" title="{{r.label}}" style="{{r.style}}">
                  <x-import component-from-global-scope="BepHoaLac.Icon" name="{{r.icon}}"></x-import>
                </button>
              </sc-for>
            </span>
            </div>
            <sc-if value="{{dh.showNote}}" hint-placeholder-val="{{false}}">
              <textarea class="note" rows="2" maxlength="300" value="{{dh.note}}" onChange="{{dh.setNote}}" placeholder="Ghi chú cho món này" aria-label="{{dh.noteLabel}}" style="font-size: 13px; line-height: 18px; padding: 8px 10px"></textarea>
            </sc-if>
            <sc-if value="{{dh.canAdd}}" hint-placeholder-val="{{true}}">
              <button class="addnote" onClick="{{dh.openNote}}">+ Ghi chú cho món này</button>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <label for="meal-note" style="font-size: 17px; line-height: 24px; font-weight: 600">{{noteTitle}} <span style="color: var(--ink-muted); font-size: 13px; font-weight: 400">(không bắt buộc)</span></label>
        <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{count}}/300</span>
      </div>
      <textarea id="meal-note" class="note" rows="3" maxlength="300" value="{{note}}" onChange="{{setNote}}" placeholder="Ví dụ: lần sau bớt muối, thêm ớt"></textarea>
      <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">Ghi chú được lưu vào Lịch sử nấu, xem lại khi nấu món này lần sau.</span>
    </section>
  </main>

  <!-- Flutter (F2): ratings and notes stay in the ViewModel and are written to cookHistoryProvider when the user finishes on PantryUpdate. -->
  <footer style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 24px 16px; border-top: 1px solid var(--line); background: var(--surface-raised)">
    <a href="PantryUpdate.dc.html" class="bh-btn bh-btn-primary bh-btn-block bh-btn-lg" style="text-decoration: none">Nguyên liệu chưa dùng tới</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"sample":{"editor":"enum","options":["thường","tên dài, nhiều món"],"default":"thường"},"$preview":{"width":390,"height":844}}'>
var DISHES = ['Đậu phụ sốt cà chua', 'Trứng chiên hành'];
var RATINGS = [['good', 'Ngon', 'smile'], ['ok', 'Tạm', 'meh'], ['bad', 'Chê', 'frown']];
// Tweak 'sample' = 'tên dài, nhiều món' swaps in long dish names and extra dishes to stress the layout.
var LONG = {
'Đậu phụ sốt cà chua': 'Đậu phụ non sốt cà chua nấm hương kiểu nhà làm',
'Trứng chiên hành': 'Trứng chiên hành lá với thịt băm và mộc nhĩ',
'Canh cà chua trứng': 'Canh cà chua trứng nấu đậu phụ non và rau mùi',
'Cơm rang dưa cải': 'Cơm rang dưa cải thịt bò kiểu sinh viên ký túc xá',
'Mì xào rau cải': 'Mì tôm xào rau cải ngọt với trứng và xúc xích',
'Trứng hấp thịt băm': 'Trứng hấp thịt băm nấm mèo trong nồi cơm điện'
};
var EXTRA = ['Rau muống xào tỏi', 'Canh bí đỏ nấu tôm khô với rau ngót'];
var STRESS = false;
function L(n) { return STRESS && LONG[n] ? LONG[n] : n; }
// Lists of dishes: up to 2 names in full, then "+N món".
function summary(list) {
var names = list.map(L);
return names.length <= 2 ? names.join(', ') : names.slice(0, 2).join(', ') + ' +' + (names.length - 2) + ' món';
}
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { rating: { 0: 'good' }, notes: {}, open: {}, note: '' };
}
renderVals() {
STRESS = this.props.sample === 'tên dài, nhiều món';
var dishes = DISHES.concat(STRESS ? EXTRA : []);
var self = this;
var st = this.state;
return {
theme: this.props.theme ?? 'system',
meta: dishes.length + ' món · 1 người · khoảng ' + (STRESS ? 55 : 35) + ' phút',
dishes: dishes.map(function (name, di) {
name = L(name);
var cur = st.rating[di];
var curLabel = RATINGS.filter(function (r) { return r[0] === cur; })[0];
return {
name: name,
picked: curLabel ? 'Bạn chấm: ' + curLabel[1] : 'Chưa chấm',
groupLabel: 'Đánh giá ' + name,
rowStyle: di < dishes.length - 1 ? 'border-bottom: 1px solid var(--line);' : '',
ratings: RATINGS.map(function (r) {
var on = cur === r[0];
return {
label: r[1] + ' · ' + name,
icon: r[2],
on: on,
style: on ? 'border: 1px solid var(--chili-soft); background: var(--chili-soft); color: var(--chili-deep);' : 'border: 1px solid var(--outline); background: var(--surface-raised); color: var(--ink);',
pick: function () {
var next = Object.assign({}, self.state.rating);
next[di] = r[0];
self.setState({ rating: next });
}
};
}),
showNote: !!(st.open[di] || st.notes[di]),
canAdd: !(st.open[di] || st.notes[di]),
note: st.notes[di] || '',
noteLabel: 'Ghi chú cho ' + name,
openNote: function () { var o = Object.assign({}, self.state.open); o[di] = true; self.setState({ open: o }); },
setNote: function (e) { var nx = Object.assign({}, self.state.notes); nx[di] = e && e.target ? e.target.value : ''; self.setState({ notes: nx }); }
};
}),
noteTitle: 'Ghi chú cho bữa',
note: st.note,
count: st.note.length,
setNote: function (e) { self.setState({ note: e && e.target ? e.target.value : '' }); }
};
}
}
</script>
</body>
</html>
