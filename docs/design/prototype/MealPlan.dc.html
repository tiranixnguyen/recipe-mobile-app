<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thực đơn</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a{color:var(--chili-deep)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 8px 16px; flex-shrink: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Thực đơn</h1>
      <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px; font-weight: 600">Đã lên {{plannedCount}}/21 bữa</span>
    </div>
    <div role="group" aria-label="Chế độ xem" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; gap: 4px; border: 1px solid var(--outline); border-radius: 999px; background: var(--surface-raised)">
      <button onClick="{{showDay}}" aria-pressed="{{isDay}}" style="height: 40px; border: 0; border-radius: 999px; font: 600 13px/18px 'Be Vietnam Pro', sans-serif; cursor: pointer; {{dayTabStyle}}">Ngày</button>
      <button onClick="{{showWeek}}" aria-pressed="{{isWeek}}" style="height: 40px; border: 0; border-radius: 999px; font: 600 13px/18px 'Be Vietnam Pro', sans-serif; cursor: pointer; {{weekTabStyle}}">Tuần</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 16px 16px">
    <sc-if value="{{isDay}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button onClick="{{d.pick}}" aria-pressed="{{d.on}}" aria-label="{{d.full}}" style="height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: 'Be Vietnam Pro', sans-serif; {{d.style}}">
            <span style="font-size: 13px; line-height: 18px; font-weight: 600">{{d.short}}</span>
            <span style="width: 6px; height: 6px; border-radius: 999px; {{d.dotStyle}}"></span>
          </button>
        </sc-for>
      </div>
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 600">{{dayTitle}}</h2>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; align-items: center; justify-content: space-between; min-height: 24px">
              <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px; font-weight: 600">{{s.meal}}{{s.countLabel}}</span>
              <sc-if value="{{s.filled}}" hint-placeholder-val="{{true}}">
                <a href="Today.dc.html" style="padding: 2px 4px; font-size: 13px; line-height: 18px; font-weight: 600; text-decoration: none">+ Thêm món</a>
              </sc-if>
            </div>
            <sc-for list="{{s.dishes}}" as="dsh" hint-placeholder-count="1">
              <a href="Detail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none">
                <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background: var(--line)"></div>
                <div style="flex: 1; display: flex; flex-direction: column">
                  <span style="font-size: 15px; line-height: 22px; font-weight: 600">{{dsh.name}}</span>
                  <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{dsh.meta}}</span>
                </div>
              </a>
            </sc-for>
            <sc-if value="{{s.empty}}" hint-placeholder-val="{{false}}">
              <a href="Today.dc.html" style="height: 58px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed var(--outline); border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 22px; font-weight: 600">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                Thêm món
              </a>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isWeek}}" hint-placeholder-val="{{false}}">
      <div style="display: grid; grid-template-columns: 40px repeat(3, minmax(0, 1fr)); gap: 6px; color: var(--ink-muted); font-size: 12px; line-height: 16px; font-weight: 600">
        <span></span><span>Sáng</span><span>Trưa</span><span>Tối</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{week}}" as="row" hint-placeholder-count="7">
          <div style="display: grid; grid-template-columns: 40px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch">
            <span style="display: flex; align-items: center; font-size: 13px; line-height: 18px; font-weight: 600; {{row.labelStyle}}">{{row.short}}</span>
            <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="3">
              <a href="{{c.href}}" style="height: 56px; padding: 6px 8px; display: flex; align-items: center; border-radius: 8px; text-decoration: none; font-size: 12px; line-height: 16px; overflow: hidden; {{c.style}}">{{c.label}}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </main>

  <div style="flex-shrink: 0; display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface)">
    <button onClick="{{autofill}}" style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--outline); border-radius: 12px; background: transparent; color: var(--ink); font: 600 15px/22px 'Be Vietnam Pro', sans-serif; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"></path></svg>
      Gợi ý cả tuần
    </button>
    <a href="Shopping.dc.html" style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--chili); color: #FFFFFF; text-decoration: none; font-size: 15px; line-height: 22px; font-weight: 600">Đi chợ</a>
  </div>

  <nav aria-label="Điều hướng chính" style="height: 80px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface-raised); border-top: 1px solid var(--line)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      </span>
      Khám phá
    </a>
    <a href="Pantry.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M6 10h12M9 6v2M9 13v3"></path></svg>
      </span>
      Tủ đồ
    </a>
    <a href="MealPlan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 999px; background: var(--chili-soft); color: var(--chili-deep); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></svg>
      </span>
      Thực đơn
    </a>
    <a href="Saved.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-muted); text-decoration: none; font-size: 12px; line-height: 16px">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"></path></svg>
      </span>
      Đã lưu
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
var DAYS = [['T2', 'Thứ Hai'], ['T3', 'Thứ Ba'], ['T4', 'Thứ Tư'], ['T5', 'Thứ Năm'], ['T6', 'Thứ Sáu'], ['T7', 'Thứ Bảy'], ['CN', 'Chủ Nhật']];
var MEALS = ['Sáng', 'Trưa', 'Tối'];
var TODAY = 1;
var META = {
'Bánh mì trứng ốp': '10 phút · Bếp từ',
'Mì xào rau cải': '15 phút · Bếp từ',
'Canh cà chua trứng': '15 phút · Bếp từ',
'Trứng chiên hành': '15 phút · Bếp từ',
'Đậu phụ sốt cà chua': '20 phút · Bếp từ',
'Trứng hấp thịt băm': '20 phút · Nồi cơm điện',
'Cháo trứng hành': '25 phút · Nồi cơm điện',
'Cơm rang dưa cải': '10 phút · Bếp từ',
'Khoai tây xào thịt băm': '25 phút · Bếp từ',
'Canh rau cải thịt băm': '15 phút · Bếp từ',
'Xúc xích sốt cà chua': '15 phút · Bếp từ',
'Mì trứng hành': '10 phút · Bếp từ'
};
// Each meal holds a list of dishes (cơm + canh + mặn). Tối thứ Ba shows the dish just added from Chi tiết món.
var BASE = [
[['Bánh mì trứng ốp'], ['Mì xào rau cải'], ['Canh cà chua trứng']],
[[], ['Cơm rang dưa cải'], ['Đậu phụ sốt cà chua', 'Trứng chiên hành']],
[[], ['Trứng hấp thịt băm'], []],
[[], [], []],
[[], [], []],
[[], [], []],
[[], [], []]
];
var POOL = ['Cháo trứng hành', 'Khoai tây xào thịt băm', 'Mì trứng hành', 'Canh rau cải thịt băm', 'Xúc xích sốt cà chua', 'Bánh mì trứng ốp', 'Cơm rang dưa cải'];
function filledPlan() {
var k = 0;
return BASE.map(function (row) {
return row.map(function (v) { if (v.length) { return v; } var n = POOL[k % POOL.length]; k += 1; return [n]; });
});
}
var ON = 'background: var(--chili-soft); color: var(--chili-deep);';
var OFF = 'background: transparent; color: var(--ink);';
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'day', day: TODAY, auto: false };
}
renderVals() {
var self = this;
var st = this.state;
var plan = st.auto ? filledPlan() : BASE;
var planned = 0;
plan.forEach(function (r) { r.forEach(function (v) { if (v.length) { planned += 1; } }); });
var days = DAYS.map(function (d, i) {
var on = i === st.day;
var any = plan[i].some(function (v) { return v.length > 0; });
return {
short: d[0],
full: d[1],
on: on,
style: on ? 'border: 1px solid var(--chili); background: var(--chili); color: #FFFFFF;' : 'border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink);',
dotStyle: any ? (on ? 'background: #FFFFFF;' : 'background: var(--herb);') : 'background: transparent;',
pick: function () { self.setState({ day: i }); }
};
});
var slots = MEALS.map(function (m, j) {
var list = plan[st.day][j];
return {
meal: m,
countLabel: list.length > 1 ? ' · ' + list.length + ' món' : '',
dishes: list.map(function (n) { return { name: n, meta: META[n] }; }),
filled: list.length > 0,
empty: list.length === 0
};
});
var week = DAYS.map(function (d, i) {
return {
short: d[0],
labelStyle: i === TODAY ? 'color: var(--chili-deep);' : 'color: var(--ink);',
cells: plan[i].map(function (v) {
return v.length
? { label: v[0] + (v.length > 1 ? ' +' + (v.length - 1) : ''), href: 'Detail.dc.html', style: 'background: var(--surface-raised); border: 1px solid var(--line); color: var(--ink);' }
: { label: '+', href: 'Today.dc.html', style: 'justify-content: center; border: 1.5px dashed var(--outline); color: var(--ink-muted); font-size: 16px;' };
})
};
});
return {
theme: this.props.theme ?? 'system',
isDay: st.mode === 'day',
isWeek: st.mode === 'week',
dayTabStyle: st.mode === 'day' ? ON : OFF,
weekTabStyle: st.mode === 'week' ? ON : OFF,
showDay: function () { self.setState({ mode: 'day' }); },
showWeek: function () { self.setState({ mode: 'week' }); },
autofill: function () { self.setState({ auto: true, mode: 'week' }); },
plannedCount: planned,
days: days,
dayTitle: DAYS[st.day][1] + (st.day === TODAY ? ' · Hôm nay' : ''),
slots: slots,
week: week
};
}
}
</script>
</body>
</html>
