<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Logo Bếp Hoà Lạc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&amp;display=swap">
<style>
:root,[data-theme="light"]{--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--chili-soft:#4A2513;--chili-deep:#FFB38A;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--chili-soft:#4A2513;--chili-deep:#FFB38A;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1440px; height: 800px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif">

  <!-- A · Bát cười -->
  <section aria-label="Hướng A, Bát cười" style="display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 28px; background: var(--surface-raised); border: 1px solid var(--line)">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .06em; color: var(--chili-deep)">A · BÁT CƯỜI</span>
    <div style="display: flex; align-items: center; gap: 32px">
      <svg role="img" aria-label="Icon app hướng A" width="168" height="168" viewBox="0 0 96 96" style="flex-shrink: 0; border-radius: 40px"><rect width="96" height="96" rx="0" fill="#C2410C"></rect><path d="M38 36c-3-4 3-7 0-11M58 36c-3-4 3-7 0-11" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path><path d="M20 46h56a28 28 0 0 1-56 0z" fill="#FFFFFF"></path><circle cx="39" cy="55" r="3.2" fill="#C2410C"></circle><circle cx="57" cy="55" r="3.2" fill="#C2410C"></circle><path d="M41.5 63q6.5 5.5 13 0" fill="none" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg aria-hidden="true" width="52" height="52" viewBox="0 0 96 96" style="border-radius: 14px"><rect width="96" height="96" fill="#C2410C"></rect><path d="M38 36c-3-4 3-7 0-11M58 36c-3-4 3-7 0-11" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path><path d="M20 46h56a28 28 0 0 1-56 0z" fill="#FFFFFF"></path><circle cx="39" cy="55" r="3.2" fill="#C2410C"></circle><circle cx="57" cy="55" r="3.2" fill="#C2410C"></circle><path d="M41.5 63q6.5 5.5 13 0" fill="none" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"></path></svg>
          <span style="font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -.03em">bếp hoà lạc</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 132px; height: 112px; border-radius: 18px; background: #2A1E16; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="56" height="56" viewBox="0 0 96 96" style="border-radius: 16px"><rect width="96" height="96" fill="#C2410C"></rect><path d="M38 36c-3-4 3-7 0-11M58 36c-3-4 3-7 0-11" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path><path d="M20 46h56a28 28 0 0 1-56 0z" fill="#FFFFFF"></path><circle cx="39" cy="55" r="3.2" fill="#C2410C"></circle><circle cx="57" cy="55" r="3.2" fill="#C2410C"></circle><path d="M41.5 63q6.5 5.5 13 0" fill="none" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"></path></svg>
            <span style="color: #FFFFFF; font-size: 12px; line-height: 16px">Bếp Hoà Lạc</span>
          </div>
          <div style="width: 56px; height: 56px; border-radius: 999px; background: #2A1E16; display: flex; align-items: center; justify-content: center">
            <svg role="img" aria-label="Icon thông báo hướng A" width="32" height="32" viewBox="0 0 96 96"><path d="M38 36c-3-4 3-7 0-11M58 36c-3-4 3-7 0-11" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path><path d="M20 46h56a28 28 0 0 1-56 0z" fill="#FFFFFF"></path><circle cx="39" cy="55" r="3.6" fill="#2A1E16"></circle><circle cx="57" cy="55" r="3.6" fill="#2A1E16"></circle><path d="M41.5 63q6.5 5.5 13 0" fill="none" stroke="#2A1E16" stroke-width="4" stroke-linecap="round"></path></svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- B · b. -->
  <section aria-label="Hướng B, chữ b chấm" style="display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 28px; background: var(--surface-raised); border: 1px solid var(--line)">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .06em; color: var(--chili-deep)">B · CHỮ “b.”</span>
    <div style="display: flex; align-items: center; gap: 32px">
      <svg role="img" aria-label="Icon app hướng B" width="168" height="168" viewBox="0 0 96 96" style="flex-shrink: 0; border-radius: 40px"><rect width="96" height="96" fill="#FFF8F1"></rect><g transform="translate(-5 2)"><path d="M32 18v50" stroke="#2A1E16" stroke-width="10" stroke-linecap="round"></path><circle cx="48" cy="52" r="16" fill="none" stroke="#2A1E16" stroke-width="10"></circle><circle cx="74" cy="68" r="6.5" fill="#C2410C"></circle></g></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; align-items: baseline; gap: 2px">
          <span style="font-size: 56px; line-height: 56px; font-weight: 800; letter-spacing: -.04em">bếp</span><span style="font-size: 56px; line-height: 56px; font-weight: 800; color: #C2410C">.</span>
          <span style="margin-left: 12px; font-size: 20px; line-height: 24px; font-weight: 600; color: var(--ink-muted)">hoà lạc</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 132px; height: 112px; border-radius: 18px; background: #2A1E16; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="56" height="56" viewBox="0 0 96 96" style="border-radius: 16px"><rect width="96" height="96" fill="#FFF8F1"></rect><g transform="translate(-5 2)"><path d="M32 18v50" stroke="#2A1E16" stroke-width="10" stroke-linecap="round"></path><circle cx="48" cy="52" r="16" fill="none" stroke="#2A1E16" stroke-width="10"></circle><circle cx="74" cy="68" r="6.5" fill="#C2410C"></circle></g></svg>
            <span style="color: #FFFFFF; font-size: 12px; line-height: 16px">Bếp Hoà Lạc</span>
          </div>
          <div style="width: 56px; height: 56px; border-radius: 999px; background: #2A1E16; display: flex; align-items: center; justify-content: center">
            <svg role="img" aria-label="Icon thông báo hướng B" width="32" height="32" viewBox="0 0 96 96"><g transform="translate(-5 2)"><path d="M32 18v50" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"></path><circle cx="48" cy="52" r="16" fill="none" stroke="#FFFFFF" stroke-width="11"></circle><circle cx="74" cy="68" r="7" fill="#FFFFFF"></circle></g></svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- C · Đũa -->
  <section aria-label="Hướng C, bát và đũa" style="display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 28px; background: var(--surface-raised); border: 1px solid var(--line)">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .06em; color: var(--chili-deep)">C · BÁT &amp; ĐŨA</span>
    <div style="display: flex; align-items: center; gap: 32px">
      <svg role="img" aria-label="Icon app hướng C" width="168" height="168" viewBox="0 0 96 96" style="flex-shrink: 0; border-radius: 40px"><rect width="96" height="96" fill="#FFE3CC"></rect><path d="M36 42L76 16M46 44L84 22" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M16 48h64a32 32 0 0 1-64 0z" fill="#2A1E16"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg aria-hidden="true" width="52" height="52" viewBox="0 0 96 96" style="border-radius: 14px"><rect width="96" height="96" fill="#FFE3CC"></rect><path d="M36 42L76 16M46 44L84 22" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M16 48h64a32 32 0 0 1-64 0z" fill="#2A1E16"></path></svg>
          <span style="font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -.02em">Bếp Hoà Lạc</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 132px; height: 112px; border-radius: 18px; background: #2A1E16; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="56" height="56" viewBox="0 0 96 96" style="border-radius: 16px"><rect width="96" height="96" fill="#FFE3CC"></rect><path d="M36 42L76 16M46 44L84 22" stroke="#C2410C" stroke-width="5" stroke-linecap="round"></path><path d="M16 48h64a32 32 0 0 1-64 0z" fill="#2A1E16"></path></svg>
            <span style="color: #FFFFFF; font-size: 12px; line-height: 16px">Bếp Hoà Lạc</span>
          </div>
          <div style="width: 56px; height: 56px; border-radius: 999px; background: #2A1E16; display: flex; align-items: center; justify-content: center">
            <svg role="img" aria-label="Icon thông báo hướng C" width="32" height="32" viewBox="0 0 96 96"><path d="M36 42L76 16M46 44L84 22" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path><path d="M16 48h64a32 32 0 0 1-64 0z" fill="#FFFFFF"></path></svg>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- D · Ghim -->
  <section aria-label="Hướng D, ghim Hoà Lạc" style="display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 28px; background: var(--surface-raised); border: 1px solid var(--line)">
    <span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: .06em; color: var(--chili-deep)">D · GHIM HOÀ LẠC</span>
    <div style="display: flex; align-items: center; gap: 32px">
      <svg role="img" aria-label="Icon app hướng D" width="168" height="168" viewBox="0 0 96 96" style="flex-shrink: 0; border-radius: 40px"><rect width="96" height="96" fill="#FFF8F1"></rect><path d="M48 86s-26-24-26-44a26 26 0 0 1 52 0c0 20-26 44-26 44z" fill="#C2410C"></path><path d="M35 40h26a13 13 0 0 1-26 0z" fill="#FFFFFF"></path><path d="M48 32c-2-3 2-5 0-8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg aria-hidden="true" width="52" height="52" viewBox="0 0 96 96" style="border-radius: 14px"><rect width="96" height="96" fill="#FFF8F1"></rect><path d="M48 86s-26-24-26-44a26 26 0 0 1 52 0c0 20-26 44-26 44z" fill="#C2410C"></path><path d="M35 40h26a13 13 0 0 1-26 0z" fill="#FFFFFF"></path><path d="M48 32c-2-3 2-5 0-8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>
          <span style="font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -.03em">bếp <span style="color: var(--chili-deep)">hoà lạc</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <div style="width: 132px; height: 112px; border-radius: 18px; background: #2A1E16; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="56" height="56" viewBox="0 0 96 96" style="border-radius: 16px"><rect width="96" height="96" fill="#FFF8F1"></rect><path d="M48 86s-26-24-26-44a26 26 0 0 1 52 0c0 20-26 44-26 44z" fill="#C2410C"></path><path d="M35 40h26a13 13 0 0 1-26 0z" fill="#FFFFFF"></path><path d="M48 32c-2-3 2-5 0-8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>
            <span style="color: #FFFFFF; font-size: 12px; line-height: 16px">Bếp Hoà Lạc</span>
          </div>
          <div style="width: 56px; height: 56px; border-radius: 999px; background: #2A1E16; display: flex; align-items: center; justify-content: center">
            <svg role="img" aria-label="Icon thông báo hướng D" width="32" height="32" viewBox="0 0 96 96"><path d="M48 86s-26-24-26-44a26 26 0 0 1 52 0c0 20-26 44-26 44z" fill="#FFFFFF"></path><path d="M35 40h26a13 13 0 0 1-26 0z" fill="#2A1E16"></path></svg>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'system' };
}
}
</script>
</body>
</html>
