<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bật thông báo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a.bh-btn-primary,a.bh-btn-primary:hover{color:#FFFFFF}
a.bh-btn-ghost,a.bh-btn-ghost:hover{color:var(--chili-deep)}
.big .bh-icon{width:44px;height:44px;stroke-width:1.75}
.row .bh-icon{width:24px;height:24px}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 32px 24px">
    <div class="big" style="align-self: center; width: 96px; height: 96px; border-radius: 999px; background: var(--chili-soft); color: var(--chili); display: flex; align-items: center; justify-content: center">
      <x-import component-from-global-scope="BepHoaLac.Icon" name="bell"></x-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Bật thông báo nhé?</h1>
      <p style="margin: 0; color: var(--ink-muted); font-size: 15px; line-height: 22px">App chỉ báo khi thật sự cần, không quảng cáo.</p>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
      <li class="row" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px">
        <span style="color: var(--chili); display: flex"><x-import component-from-global-scope="BepHoaLac.Icon" name="timer"></x-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 600">Báo khi hẹn giờ nấu xong</span>
          <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px">Kể cả khi bạn đang mở app khác hay tắt màn hình.</span>
        </span>
      </li>
      <li class="row" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px">
        <span style="color: var(--chili); display: flex"><x-import component-from-global-scope="BepHoaLac.Icon" name="calendar"></x-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 600">Nhắc bữa trong thực đơn</span>
          <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px">Một lời nhắc trước bữa bạn đã lên, giờ do bạn chọn.</span>
        </span>
      </li>
    </ul>
  </main>

  <footer style="flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 24px 16px">
    <a href="Main.dc.html" class="bh-btn bh-btn-primary bh-btn-block bh-btn-lg" style="text-decoration: none">Cho phép</a>
    <a href="Main.dc.html" class="bh-btn bh-btn-ghost bh-btn-block" style="text-decoration: none">Để sau</a>
    <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px; text-align: center">Đổi lại được trong Cài đặt.</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'system' };
}
}
</script>
</body>
</html>
