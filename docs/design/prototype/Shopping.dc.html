<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Danh sách đi chợ</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bep-hoa-lac/components/bundle.css">
<script src="ds/bep-hoa-lac/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
:root,[data-theme="light"]{--font-sans:"Be Vietnam Pro",system-ui,sans-serif;--surface:#FFF8F1;--surface-raised:#FFFFFF;--ink:#2A1E16;--ink-muted:#6E5D50;--line:#EADFD3;--outline:#958170;--chili:#C2410C;--chili-soft:#FFE3CC;--chili-deep:#9A3412;--herb:#2F7A3E;--herb-ink:#2F7A3E;--herb-soft:#DDF0DF;--danger:#B42318;--danger-ink:#B42318;--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:12px;--radius-pill:999px;color-scheme:light}
[data-theme="dark"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme="system"]{--surface:#1A1410;--surface-raised:#26201A;--ink:#F5EDE6;--ink-muted:#BFAE9F;--line:#3A3029;--outline:#8C7A6B;--chili-soft:#4A2513;--chili-deep:#FFB38A;--herb-ink:#7FCB8F;--herb-soft:#1F3A25;--danger-ink:#FF8A80;color-scheme:dark}}
body{margin:0}
*{box-sizing:border-box}
a{color:var(--chili-deep)}
input[type=checkbox]{accent-color:var(--herb)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 4px; height: 64px; flex-shrink: 0">
    <a href="MealPlan.dc.html" aria-label="Quay lại thực đơn" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--ink)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Danh sách đi chợ</h1>
      <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">Cho thực đơn tuần này · {{doneCount}}/{{total}} đã mua</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 12px 16px 16px 16px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--herb-soft); color: var(--ink); font-size: 13px; line-height: 18px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--herb-ink); flex-shrink: 0"><path d="M5 12l5 5 9-10"></path></svg>
      <span>Đã bỏ <strong>4 thứ</strong> có sẵn trong Tủ đồ: trứng, hành lá, cơm, mì gói.</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-muted)">{{g.label}}</h2>
        <ul style="margin: 0; padding: 0 12px; list-style: none; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px">
          <sc-for list="{{g.items}}" as="item" hint-placeholder-count="2">
            <li style="{{item.rowStyle}}">
              <label style="min-height: 52px; display: flex; align-items: center; gap: 12px; cursor: pointer">
                <input type="checkbox" checked="{{item.done}}" onChange="{{item.toggle}}" style="width: 20px; height: 20px; margin: 0">
                <span style="flex: 1; display: flex; flex-direction: column">
                  <span style="font-size: 15px; line-height: 22px; {{item.nameStyle}}">{{item.name}}</span>
                  <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px">{{item.recipe}}</span>
                </span>
              </label>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </main>

  <footer style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 24px 16px; border-top: 1px solid var(--line); background: var(--surface-raised)">
    <span style="color: var(--ink-muted); font-size: 12px; line-height: 16px; text-align: center">Thứ đã tick sẽ được cất vào Tủ đồ.</span>
    <a href="Pantry.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--chili); color: #FFFFFF; text-decoration: none; font-size: 17px; line-height: 24px; font-weight: 600">Xong, cất vào tủ</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":390,"height":844}}'>
var GROUPS = [
{ label: 'Rau củ', items: [
{ id: 'tomato', name: 'Cà chua · 4 quả', recipe: 'Canh cà chua trứng, Đậu phụ sốt cà chua' },
{ id: 'greens', name: 'Rau cải ngọt · 2 bó', recipe: 'Mì xào rau cải, Canh rau cải thịt băm' },
{ id: 'potato', name: 'Khoai tây · 3 củ', recipe: 'Khoai tây xào thịt băm' }
] },
{ label: 'Đạm', items: [
{ id: 'tofu', name: 'Đậu phụ · 2 bìa', recipe: 'Đậu phụ sốt cà chua' },
{ id: 'pork', name: 'Thịt băm · 300 g', recipe: 'Trứng hấp, Khoai tây xào, Canh rau cải' }
] },
{ label: 'Khác', items: [
{ id: 'bread', name: 'Bánh mì · 2 ổ', recipe: 'Bánh mì trứng ốp' },
{ id: 'garlic', name: 'Tỏi · 1 củ', recipe: 'Mì xào rau cải' }
] }
];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: { tomato: true } };
}
renderVals() {
var self = this;
var done = this.state.done;
var count = 0;
var total = 0;
var groups = GROUPS.map(function (g) {
return {
label: g.label,
items: g.items.map(function (it, i) {
var d = !!done[it.id];
total += 1;
if (d) { count += 1; }
return {
name: it.name,
recipe: it.recipe,
done: d,
rowStyle: i < g.items.length - 1 ? 'border-bottom: 1px solid var(--line);' : '',
nameStyle: d ? 'color: var(--ink-muted); text-decoration: line-through;' : '',
toggle: function () {
var next = Object.assign({}, self.state.done);
next[it.id] = !d;
self.setState({ done: next });
}
};
})
};
});
return { theme: this.props.theme ?? 'system', groups: groups, doneCount: count, total: total };
}
}
</script>
</body>
</html>
